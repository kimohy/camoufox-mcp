[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camoufox-mcp-gateway"
version = "1.0.0"
description = "Multi-session isolated Camoufox MCP-as-a-Service Gateway with SSRF protection and Dual-Auth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.8.0",
    "playwright>=1.48.0",
    "starlette>=0.40.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
