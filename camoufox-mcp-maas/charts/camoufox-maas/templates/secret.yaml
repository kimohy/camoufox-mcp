apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: camoufox-maas
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  MCP_API_KEYS: {{ .Values.auth.mcpApiKeys | quote }}
  SECRET_URL_TOKEN: {{ .Values.auth.secretUrlToken | quote }}
  OAUTH_CLIENT_ID: {{ .Values.auth.oauthClientId | default "camoufox-mcp-client" | quote }}
  OAUTH_CLIENT_SECRET: {{ .Values.auth.oauthClientSecret | default "" | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.auth.googleClientId | default "" | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.auth.googleClientSecret | default "" | quote }}
  ALLOWED_GOOGLE_EMAILS: {{ .Values.auth.allowedGoogleEmails | default "kimohy@gmail.com" | quote }}
  DEFAULT_PROXY_SERVER: {{ .Values.proxy.defaultProxyServer | default "" | quote }}
  WS_PATH: {{ .Values.browserPool.wsPath | default "stealth-agent" | quote }}
