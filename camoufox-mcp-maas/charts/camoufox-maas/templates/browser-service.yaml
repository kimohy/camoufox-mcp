apiVersion: v1
kind: Service
metadata:
  name: camoufox-browser-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: camoufox-browser
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: browser-pool
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: ws
      port: {{ .Values.browserPool.port }}
      targetPort: ws
      protocol: TCP
  selector:
    app.kubernetes.io/name: camoufox-browser
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: browser-pool
