name: Build and Publish GHCR Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  POOL_IMAGE: ghcr.io/kimohy/camoufox-pool
  GATEWAY_IMAGE: ghcr.io/kimohy/camoufox-mcp-gateway

jobs:
  build-gateway:
    name: Build & Push MCP Gateway (amd64 + arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push camoufox-mcp-gateway
        uses: docker/build-push-action@v6
        with:
          context: ./docker/mcp-gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:latest
            ${{ env.GATEWAY_IMAGE }}:1.0.0
            ${{ env.GATEWAY_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  build-pool-amd64:
    name: Build & Push Camoufox Pool (linux/amd64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push camoufox-pool (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./docker/camoufox-pool
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.POOL_IMAGE }}:amd64-${{ github.sha }}
          cache-from: type=gha,scope=pool-amd64
          cache-to: type=gha,mode=max,scope=pool-amd64

  build-pool-arm64:
    name: Build & Push Camoufox Pool (linux/arm64 native)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push camoufox-pool (arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./docker/camoufox-pool
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.POOL_IMAGE }}:arm64-${{ github.sha }}
          cache-from: type=gha,scope=pool-arm64
          cache-to: type=gha,mode=max,scope=pool-arm64

  merge-pool-manifest:
    name: Create Multi-Arch Manifest for Camoufox Pool
    needs:
      - build-pool-amd64
      - build-pool-arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest list
        run: |
          docker buildx imagetools create -t ${{ env.POOL_IMAGE }}:latest \
            -t ${{ env.POOL_IMAGE }}:1.0.0 \
            -t ${{ env.POOL_IMAGE }}:sha-${{ github.sha }} \
            ${{ env.POOL_IMAGE }}:amd64-${{ github.sha }} \
            ${{ env.POOL_IMAGE }}:arm64-${{ github.sha }}
