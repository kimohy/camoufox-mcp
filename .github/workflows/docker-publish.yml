name: Build and Publish GHCR Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  POOL_IMAGE: ghcr.io/kimohy/camoufox-pool
  GATEWAY_IMAGE: ghcr.io/kimohy/camoufox-mcp-gateway

jobs:
  changes:
    name: Detect Component Changes
    runs-on: ubuntu-24.04
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      pool: ${{ steps.filter.outputs.pool }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check changed files
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "gateway=true" >> "$GITHUB_OUTPUT"
            echo "pool=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD || echo "all")
            if echo "$CHANGED" | grep -qE "^(docker/mcp-gateway/|all)"; then
              echo "gateway=true" >> "$GITHUB_OUTPUT"
            else
              echo "gateway=false" >> "$GITHUB_OUTPUT"
            fi
            if echo "$CHANGED" | grep -qE "^(docker/camoufox-pool/|all)"; then
              echo "pool=true" >> "$GITHUB_OUTPUT"
            else
              echo "pool=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-gateway-amd64:
    name: Build & Push MCP Gateway (linux/amd64)
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push camoufox-mcp-gateway (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./docker/mcp-gateway
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:amd64-${{ github.sha }}
          cache-from: type=gha,scope=gateway-amd64
          cache-to: type=gha,mode=max,scope=gateway-amd64

  build-gateway-arm64:
    name: Build & Push MCP Gateway (linux/arm64 native)
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push camoufox-mcp-gateway (arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./docker/mcp-gateway
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:arm64-${{ github.sha }}
          cache-from: type=gha,scope=gateway-arm64
          cache-to: type=gha,mode=max,scope=gateway-arm64

  merge-gateway-manifest:
    name: Create Multi-Arch Manifest for MCP Gateway
    needs:
      - changes
      - build-gateway-amd64
      - build-gateway-arm64
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest list
        run: |
          docker buildx imagetools create -t ${{ env.GATEWAY_IMAGE }}:latest \
            -t ${{ env.GATEWAY_IMAGE }}:1.0.0 \
            -t ${{ env.GATEWAY_IMAGE }}:sha-${{ github.sha }} \
            ${{ env.GATEWAY_IMAGE }}:amd64-${{ github.sha }} \
            ${{ env.GATEWAY_IMAGE }}:arm64-${{ github.sha }}

  build-pool-amd64:
    name: Build & Push Camoufox Pool (linux/amd64)
    needs: changes
    if: needs.changes.outputs.pool == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push camoufox-pool (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./docker/camoufox-pool
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.POOL_IMAGE }}:amd64-${{ github.sha }}
          cache-from: type=gha,scope=pool-amd64
          cache-to: type=gha,mode=max,scope=pool-amd64

  build-pool-arm64:
    name: Build & Push Camoufox Pool (linux/arm64 native)
    needs: changes
    if: needs.changes.outputs.pool == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push camoufox-pool (arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./docker/camoufox-pool
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.POOL_IMAGE }}:arm64-${{ github.sha }}
          cache-from: type=gha,scope=pool-arm64
          cache-to: type=gha,mode=max,scope=pool-arm64

  merge-pool-manifest:
    name: Create Multi-Arch Manifest for Camoufox Pool
    needs:
      - changes
      - build-pool-amd64
      - build-pool-arm64
    if: needs.changes.outputs.pool == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest list
        run: |
          docker buildx imagetools create -t ${{ env.POOL_IMAGE }}:latest \
            -t ${{ env.POOL_IMAGE }}:1.0.0 \
            -t ${{ env.POOL_IMAGE }}:sha-${{ github.sha }} \
            ${{ env.POOL_IMAGE }}:amd64-${{ github.sha }} \
            ${{ env.POOL_IMAGE }}:arm64-${{ github.sha }}
